name: Checkpoint A11y
description: Run accessibility checks on user flows and fail the pull request on new issues.
branding: { icon: check-circle, color: blue }

inputs:
  working-directory:
    description: Directory containing checkpoint-a11y.config.ts
    default: .
  base-url:
    description: URL of the app under test (overrides baseURL in the config)
    required: false
  token:
    description: Checkpoint A11y project token (CHECKPOINT_A11Y_TOKEN). Omit to run in local mode with a committed baseline.
    required: false
  api-url:
    description: Checkpoint A11y API URL
    required: false
  github-token:
    description: Token used to post the PR comment
    default: ${{ github.token }}
  comment:
    description: Post or update the PR comment
    default: 'true'
  update-baseline:
    description: Record the baseline (local mode). Defaults to true on the default branch.
    default: ${{ github.ref_name == github.event.repository.default_branch && 'true' || 'false' }}
  install-browsers:
    description: Install Playwright Chromium before running
    default: 'true'
  version:
    description: Version of @checkpoint-a11y/runner to use if the project does not install it
    default: latest

outputs:
  passed:
    description: '"true" if the gate passed'
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Install Playwright Chromium
      if: inputs.install-browsers == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --yes playwright install --with-deps chromium

    - name: Run Checkpoint A11y
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECKPOINT_A11Y_TOKEN: ${{ inputs.token }}
        CHECKPOINT_A11Y_API_URL: ${{ inputs.api-url }}
        CHECKPOINT_A11Y_BASE_URL: ${{ inputs.base-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(run)
        [ "${{ inputs.comment }}" = "true" ] && args+=(--comment)
        [ "${{ inputs.update-baseline }}" = "true" ] && args+=(--update-baseline)
        if [ -x node_modules/.bin/checkpoint-a11y ]; then bin=node_modules/.bin/checkpoint-a11y; else bin="npx --yes @checkpoint-a11y/runner@${{ inputs.version }}"; fi
        set +e
        $bin "${args[@]}"
        code=$?
        set -e
        if [ $code -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        exit $code

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkpoint-a11y-results
        path: ${{ inputs.working-directory }}/.checkpoint-a11y/results
        if-no-files-found: ignore
